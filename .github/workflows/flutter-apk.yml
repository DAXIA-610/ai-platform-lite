name: Build Flutter APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/flutter-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Init android skeleton
        working-directory: app
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --platforms=android --org com.space --project-name aichat .
          cp /tmp/pubspec.yaml pubspec.yaml
          python3 - <<'EOF'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\\n    <application', 1)
          if 'usesCleartextTraffic' not in s:
              s = re.sub(r'<application\\b', '<application android:usesCleartextTraffic="true"', s, count=1)
          open(p, 'w').write(s)
          print('PATCHED')
          print(open(p).read())
          EOF

      - name: Get deps
        working-directory: app
        run: flutter pub get

      - name: Build APK
        id: build
        continue-on-error: true
        working-directory: app
        run: flutter build apk --release 2>&1 | tee /tmp/build.log

      - name: 构建失败就把编译错误写进仓库（方便定位）
        if: steps.build.outcome == 'failure'
        run: |
          {
            echo "# APK 构建失败";
            echo "";
            echo "时间（UTC）：$(date -u)";
            echo "";
            echo '```';
            tail -160 /tmp/build.log;
            echo '```';
          } > BUILD_ERROR.md
          git config user.name "ai-platform-bot"
          git config user.email "actions@users.noreply.github.com"
          git add BUILD_ERROR.md
          git commit -m "build: APK 构建失败，错误日志见 BUILD_ERROR.md [skip ci]"
          git push

      - name: Upload APK to Release
        if: steps.build.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f BUILD_ERROR.md
          gh release delete latest --yes >/dev/null 2>&1 || true
          gh release create latest app/build/app/outputs/flutter-apk/app-release.apk \
            --title "AI 社交" \
            --notes "最新版 APK：进「游戏」tab → 真心话大冒险，环形座位 + 中心书卷；后端改成题库自动抽题（输家是真人就抽人题、是 AI 就抽 AI 题）。" \
            --latest
