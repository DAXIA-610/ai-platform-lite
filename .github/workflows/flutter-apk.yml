name: Build Flutter APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/flutter-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Init android skeleton
        working-directory: app
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --platforms=android --org com.space --project-name aichat .
          cp /tmp/pubspec.yaml pubspec.yaml
          python3 - <<'EOF'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\\n    <application', 1)
          if 'usesCleartextTraffic' not in s:
              s = re.sub(r'<application\\b', '<application android:usesCleartextTraffic="true"', s, count=1)
          open(p, 'w').write(s)
          print('PATCHED')
          print(open(p).read())
          EOF

      - name: Get deps
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes >/dev/null 2>&1 || true
          gh release create latest app/build/app/outputs/flutter-apk/app-release.apk --title "AI 社交" --notes "最新版 APK，下载安装后打开，进「游戏」tab 就可以开房玩谁是卧底。" --latest