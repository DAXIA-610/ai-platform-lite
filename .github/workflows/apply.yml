name: Apply patches

on:
  push:
    branches: [ main ]
    paths:
      - 'patch/**'
      - '.github/workflows/apply.yml'
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 有没有补丁要打
        id: check
        run: |
          if ls patch/*.py >/dev/null 2>&1; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
            ls -1 patch/*.py
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "patch/ 里没有补丁，跳过"
          fi

      - name: 依次打补丁
        if: steps.check.outputs.ready == 'yes'
        run: |
          set -e
          for f in $(ls patch/*.py | sort); do
            echo "===== $f ====="
            python3 "$f"
          done

      - name: 语法自检
        if: steps.check.outputs.ready == 'yes'
        run: |
          set -e
          python3 -m py_compile server.py tasks.py
          python3 -c "import ast; [ast.parse(open(f, encoding='utf-8').read()) for f in ['server.py','tasks.py']]; print('Python OK')"
          ls data/

      - name: 提交结果并清掉补丁
        if: steps.check.outputs.ready == 'yes'
        run: |
          set -e
          rm -f patch/*.py
          git config user.name "ai-platform-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变化，不提交"
          else
            git commit -m "chore: 应用补丁"
            git push
          fi
